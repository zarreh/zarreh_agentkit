[project]
name = "zarreh-agentkit"
version = "0.2.0"
description = "Shared substrate for agent services: typed settings, observability, dual tracing, ASGI middleware, per-node cost accounting, SSE serialization, budget/projection guardrails, and an eval-runner shell. Extracted only from working implementations, never designed up front."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.41",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "structlog>=24.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "httpx>=0.27",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Repository = "https://github.com/zarreh/zarreh-agentkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarreh_agentkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/zarreh_agentkit"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "zarreh_agentkit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layering: api/guardrails/evals depend on settings/serialization/cost, never the reverse"
type = "layers"
layers = [
    "zarreh_agentkit.api",
    "zarreh_agentkit.guardrails | zarreh_agentkit.evals",
    "zarreh_agentkit.serialization",
    "zarreh_agentkit.cost | zarreh_agentkit.observability | zarreh_agentkit.settings",
]
